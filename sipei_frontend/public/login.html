{% extends 'base.html' %}

{% load static %}

{% block title %}Login - SIPEI{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-container">

        <div class="login-header">
            <h1>SIPEI</h1>
            <p>Sistema Integrado de Plano Educacional Individualizado</p>
        </div>

        <div class="login-card">

            <img src="{% static 'img/ifbalogo.png' %}" class="logo-ifba" alt="IFBA">

            <form method="POST">

                {% csrf_token %}

                <div class="input-group">
                    <label for="username">Usuário</label>

                    <div class="input-container">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Nome de usuário"
                            required
                        >

                        <span class="material-symbols-outlined">
                            person
                        </span>
                    </div>
                </div>


                <div class="input-group">
                    <label for="password">Senha</label>

                    <div class="input-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="************"
                            required
                        >

                        <span class="material-symbols-outlined">
                            lock
                        </span>
                    </div>
                </div>


                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox" name="remember">
                        <span>Lembrar de mim</span>
                    </label>

                    <a href="#">
                        Esqueceu a senha?
                    </a>

                </div>


                {% if erro %}
                    <p class="login-error">
                        {{ erro }}
                    </p>
                {% endif %}


                <button type="submit" class="btn-login">
                    Acessar
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
