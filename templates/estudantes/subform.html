{% extends 'base.html' %}
{% block page_title %}{{ titulo }} — {{ estudante.nome_completo }}{% endblock %}
{% block content %}
<div class="card" style="max-width:700px">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
      {% if field.help_text %}<div class="form-help">{{ field.help_text }}</div>{% endif %}
    </div>
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn">Salvar</button>
      <a class="btn btn-outline" href="{% url 'estudantes:detail' estudante.pk %}?tab={{ tab }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
